version: 1
name: meta-graph
display_name: Meta Graph API
description: Meta Graph API v21.0 — Facebook/Instagram pages, posts, photos & Ads Manager
base_url: https://graph.facebook.com/v21.0
docs_url: https://developers.facebook.com/docs/graph-api

auth:
  methods:
    - type: oauth2
      authorization_url: https://www.facebook.com/v21.0/dialog/oauth
      token_url: https://graph.facebook.com/v21.0/oauth/access_token
      scopes:
        - pages_show_list
        - pages_read_engagement
        - pages_manage_posts
        - pages_manage_photos
        - ads_management
        - ads_read
        - business_management
        - instagram_basic
        - instagram_content_publish
      flows:
        - authorization_code
    - type: bearer
      description: Long-lived user or page access token (from Meta developer app)

headers:
  Content-Type: application/x-www-form-urlencoded

operations:
  get_me:
    description: Verify the access token and get the current user's identity
    method: GET
    path: /me
    query:
      fields: id,name

  list_pages:
    description: List Facebook Pages managed by the token owner (includes page access tokens)
    method: GET
    path: /me/accounts
    query:
      fields: id,name,access_token,category,tasks

  publish_post:
    description: Publish a text post to a Page or Group
    method: POST
    path: /{{ params.page_id }}/feed
    params:
      page_id: { required: true, type: string, description: "Page/Group ID (numeric or page_name)" }
      message: { required: true, type: string, description: "Post text content" }
      link: { required: false, type: string, description: "Link URL to attach" }
    body_type: form
    body:
      message: "{{ params.message }}"
      link: "{{ params.link }}"

  publish_photo:
    description: Publish a photo to a Page (from public URL or binary)
    method: POST
    path: /{{ params.page_id }}/photos
    params:
      page_id: { required: true, type: string, description: "Page/Group ID" }
      url: { required: true, type: string, description: "Public photo URL" }
      caption: { required: false, type: string }
    body_type: form
    body:
      url: "{{ params.url }}"
      caption: "{{ params.caption }}"

  list_ad_accounts:
    description: List ad accounts accessible to the token
    method: GET
    path: /me/adaccounts
    query:
      fields: id,name,account_status,currency,amount_spent

  list_campaigns:
    description: List campaigns in an ad account
    method: GET
    path: /act_{{ params.ad_account_id }}/campaigns
    params:
      ad_account_id: { required: true, type: string, description: "Ad account ID (numeric, without act_ prefix)" }
    query:
      fields: id,name,status,objective,daily_budget,lifetime_budget

  create_campaign:
    description: Create a campaign in an ad account (default special_ad_categories=[] to avoid OPT_IN_REQUIRED errors)
    method: POST
    path: /act_{{ params.ad_account_id }}/campaigns
    params:
      ad_account_id: { required: true, type: string, description: "Ad account ID (numeric, without act_ prefix)" }
      name: { required: true, type: string }
      objective: { required: true, type: string, description: "e.g. OUTCOME_AWARENESS, OUTCOME_TRAFFIC, OUTCOME_SALES, OUTCOME_LEADS" }
      status: { required: false, type: string, default: PAUSED, description: "ACTIVE or PAUSED" }
      special_ad_categories: { required: false, type: array, description: "Default [] — set to e.g. [HOUSING] only when promoting special-ads inventory" }
    body_type: form
    body:
      name: "{{ params.name }}"
      objective: "{{ params.objective }}"
      status: "{{ params.status }}"
      special_ad_categories: "{{ params.special_ad_categories }}"
