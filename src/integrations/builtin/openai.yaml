version: 1
name: openai
display_name: OpenAI
description: OpenAI API integration
base_url: https://api.openai.com/v1
docs_url: https://platform.openai.com/docs/api-reference

auth:
  methods:
    - type: bearer
      description: API key

headers:
  Content-Type: application/json

operations:
  chat_completion:
    description: Create a chat completion
    method: POST
    path: /chat/completions
    params:
      model: { required: true, type: string, description: "Model ID (e.g. gpt-4)" }
      messages: { required: true, type: array, description: "Chat messages" }
      temperature: { required: false, type: number, default: 1.0 }
      max_tokens: { required: false, type: integer }
    body:
      model: "{{ params.model }}"
      messages: "{{ params.messages }}"
      temperature: "{{ params.temperature }}"
      max_tokens: "{{ params.max_tokens }}"

  create_embedding:
    description: Create embeddings
    method: POST
    path: /embeddings
    params:
      model: { required: true, type: string }
      input: { required: true, type: string }
    body:
      model: "{{ params.model }}"
      input: "{{ params.input }}"

  transcribe_audio:
    description: Transcribe audio to text (Whisper). audio param = data URI (data:<mime>;base64,...) dari voice note/attachment
    method: POST
    path: /audio/transcriptions
    body_type: multipart
    params:
      audio: { required: true, type: string, description: "Base64 audio as data URI: data:audio/ogg;base64,..." }
      language: { required: false, type: string, description: "Optional ISO-639-1 language hint" }
    body:
      model: whisper-1
      file: "{{ params.audio }}"
      response_format: json

  list_models:
    description: List available models
    method: GET
    path: /models
    params: {}
